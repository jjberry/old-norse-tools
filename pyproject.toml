[project]
name = "old-norse-tools"
version = "0.1.0"
description = "Old Norse lexical database, morphological parser, and text analysis tools based on A New Introduction to Old Norse (VSNR)"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
nion-build = "nion.scripts.build_db:main"
nion-analyze = "nion.tools.analyze:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
